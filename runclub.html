<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #d9d9d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      font-family: "Geist", sans-serif;
      font-weight: 500;
    }

    .poster {
      width: 8.5in;
      height: 11in;
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 0.5in;
      left: 0.5in;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .schedule {
      position: absolute;
      right: 0.5in;
      bottom: 0.5in;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 0.18in;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="title">run club.</div>

    <div class="schedule">
      <div>Last week:</div>
      <div>This week: Queensboro Bridge</div>
      <div>Next week: Queensboro Bridge</div>
    </div>
  </div>
</body>
</html>
