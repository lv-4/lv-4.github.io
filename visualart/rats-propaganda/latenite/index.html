  <style>
    /* Base Layout */
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000;
      font-family: 'VT323', monospace;
    }

    #screen {
      width: 100%;
      height: 100%;
      background: transparent
        linear-gradient(to bottom, #85908c 0%, #323431 100%)
        repeat scroll 0 0;
      background-size: cover;
      position: relative;
      overflow: hidden;
    }

    #rats {
      position: absolute;
      top: 10px;
      left: 30px;
      font-family: 'VT323', monospace;
      font-size: 5rem;
      color: #fafafa;
      letter-spacing: 8px;
      z-index: 10;
      filter: blur(1.2px);
      text-shadow: 
        0 0 10px rgba(191, 191, 191, 0.8), 
        0 0 30px rgba(173, 173, 173, 0.5),
        2px 2px 0px rgba(218, 218, 218, 0.6),
        -2px -2px 0px rgba(0, 255, 255, 0.6);
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 9998;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .screen-container {
      width: 420px;
      height: 420px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      border-radius: 6px;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      height: 100%; 
    }

    .image {
      width: 100%;
      height: auto;
      filter: blur(1.2px) brightness(0.7);
      position: relative;
      bottom: 100px;
    }

    .vignette {
      background-image: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/86186/crt.png);
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0; 
      background-repeat: no-repeat;
      background-size: 100% 100%; 
      z-index: 10000;
      pointer-events: none;
    }

    .scanlines {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0; 
      z-index: 9999;
      opacity: 0.5;
      background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(2, 2, 2, 0.75) 50%
        ),
        linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.06),
          rgba(0, 255, 0, 0.02),
          rgba(0, 0, 255, 0.06)
        );
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* Cleaned Table of Contents / Custom Mods Styles */


    .tocContainer{
      position:absolute;
      top: 164px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .toc {
      position: absolute;
      top: 164px;
      left: 30px;
      display: flex;
      flex-direction: row;
      color: #fafafa;
      font-family: 'VT323', monospace;
      font-size: 1.6rem;
      letter-spacing: 3px;
      z-index: 10;
      filter: blur(0.7px);
      text-shadow: 
        0 0 8px rgba(191, 191, 191, 0.8), 
        0 0 15px rgba(173, 173, 173, 0.5), 
        1px 1px 0px rgba(218, 218, 218, 0.6), 
        -1px -1px 0px rgba(0, 255, 255, 0.6);
    }

    .toc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .toc-title {
      white-space: nowrap;
    }

    .toc-dots {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 13px;
      position: relative;
      bottom: -9px;
    }

    .dot {
      display: block;
      width: 5px;
      height: 5px;
      background-color: white;
      position: relative;
      bottom: 4px;
      filter: blur(0.7px);
      text-shadow: 
        0 0 10px rgba(191, 191, 191, 0.8), 
        0 0 30px rgba(173, 173, 173, 0.5), 
        2px 2px 0px rgba(218, 218, 218, 0.6), 
        -2px -2px 0px rgba(0, 255, 255, 0.6);
    }

    .toc-page {
      white-space: nowrap;
    }

    .dg.ac {
      z-index: 10001 !important;
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <div class="screen-wrapper">
      <div class="screen-wrapper">
        <div class="screen-wrapper">
          <div id="screen">
            <img class="image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-66cQ2MEKR0KEQECJ51ZpqFL4ApRoVnNrb-i11HxPrjaCf9xsCOCDuunn&s=10">

            <div class='tocContainer'>
              <nav class="toc">
                <div class="toc-item">
                  <span class="toc-title">Trash (LB)</span>
                  <div class="toc-dots" aria-hidden="true">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                  </div>
                  <span class="toc-page">919</span>

              </nav>
  
  
              <nav class="toc">
                <div class="toc-item">
                  <span class="toc-title">Bags</span>
                  <div class="toc-dots" aria-hidden="true">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>

              </nav>
  
               <nav class="toc">
                <div class="toc-item">
                  <span class="toc-title">Attendance</span>
                  <div class="toc-dots" aria-hidden="true">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>

                    <span class="dot"></span>
                    <span class="dot"></span>
                  </div>
                  <span class="toc-page">17</span>
                </div>
              </nav>
            </div>


          </div>
        </div>
      </div>
      <div class="scanlines"></div>
    </div>
  </div>
  <div class="vignette"></div>

  <script>
    class ScreenEffect {
      constructor(parent, options) {
        this.parent = parent;
        if (typeof parent === "string") {
          this.parent = document.querySelector(parent);
        }
        
        this.config = Object.assign({}, {}, options);
        this.effects = {};
        this.events = {
          resize: this.onResize.bind(this)
        };
        
        window.addEventListener("resize", this.events.resize, false);
        this.render();
      }
      
      render() {
        const container = document.createElement("div");
        container.classList.add("screen-container");
        
        const wrapper1 = document.createElement("div");
        wrapper1.classList.add("screen-wrapper");
        
        const wrapper2 = document.createElement("div");
        wrapper2.classList.add("screen-wrapper"); 
        
        const wrapper3 = document.createElement("div");
        wrapper3.classList.add("screen-wrapper");     
        
        wrapper1.appendChild(wrapper2);
        wrapper2.appendChild(wrapper3);
        container.appendChild(wrapper1);
        
        this.parent.parentNode.insertBefore(container, this.parent);
        wrapper3.appendChild(this.parent);
        
        this.nodes = { container, wrapper1, wrapper2, wrapper3 };
        this.onResize();
      }
      
      onResize(e) {
        this.rect = this.parent.getBoundingClientRect();
      }
      
      add(type, options) {
        const config = Object.assign({}, {
          fps: 30,
          blur: 1
        }, options);
        
        let node = false;
        let wrapper = this.nodes.wrapper2;
        
        switch(type) {
          case "scanlines":
            node = document.createElement("div");
            node.classList.add(type);
            wrapper.appendChild(node);
            break;
          case "vignette":
            wrapper = this.nodes.container;
            node = document.createElement("div");
            node.classList.add(type);
            wrapper.appendChild(node);
            break;
          case "image":
            wrapper = this.parent;
            node = document.createElement('img');
            node.classList.add(type);
            node.src = config.src;
            wrapper.appendChild(node);
            break;
          case "rats":
            wrapper = this.parent;
            node = document.querySelector("#rats");
            if (node) {
              wrapper.appendChild(node);
              node.style.filter = `blur(${config.blur}px)`;
            }
            break;
        }

        this.effects[type] = {
          wrapper,
          node,
          enabled: true,
          config
        };
        
        return this;
      }
    }

    const screen = new ScreenEffect("#screen", {});
    const gui = new dat.GUI();

    const config = {
      effects: {
        image: {
          enabled: true,
          options: {
            src: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-66cQ2MEKR0KEQECJ51ZpqFL4ApRoVnNrb-i11HxPrjaCf9xsCOCDuunn&s=10",        
            blur: 1.2
          }
        },
        rats: {
          enabled: true,
          options: { blur: 1.2 }
        },
        vignette: { enabled: true },
        scanlines: { enabled: true },
      },
    };

    setTimeout(() => {
      for (const prop in config.effects) {
        if (!!config.effects[prop].enabled) {
          screen.add(prop, config.effects[prop].options);
        }
      }
    }, 1000);
  </script>
</body>
</html>
